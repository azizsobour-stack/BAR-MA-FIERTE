<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle / icon tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle African geometric accent ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#f97316" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="14 10"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Inner Plate / Dish Circle -->
  <circle cx="256" cy="256" r="168" fill="#261b13" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="156" fill="none" stroke="url(#goldGrad)" stroke-width="5"/>

  <!-- Braise / Flame symbol (Cuisine braisée togolaise) -->
  <g transform="translate(256, 210)">
    <!-- Main central flame -->
    <path d="M0,45 C-35,30 -50,-10 -25,-60 C-10,-40 0,-30 0,-15 C10,-35 25,-45 40,-35 C45,-15 35,25 0,45 Z" fill="url(#flameGrad)" filter="url(#shadow)"/>
    <!-- Inner bright flame core -->
    <path d="M0,40 C-18,28 -25,0 -12,-25 C-5,-15 0,-10 0,0 C5,-10 12,-18 20,-12 C22,0 18,25 0,40 Z" fill="#fef08a"/>
  </g>

  <!-- Grill / Cloche base & Crossed Utensils -->
  <g transform="translate(256, 280)" filter="url(#shadow)">
    <!-- Grill Plate Base -->
    <ellipse cx="0" cy="30" rx="95" ry="16" fill="#7c2d12" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <!-- Fork left -->
    <g transform="translate(-48, 10) rotate(-28)">
      <path d="M0,-50 L0,20 M-10,-50 L-10,-20 Q-10,-10 0,-10 Q10,-10 10,-20 L10,-50" fill="none" stroke="#faf6f0" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M0,-10 L0,45" stroke="#faf6f0" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Knife right -->
    <g transform="translate(48, 10) rotate(28)">
      <path d="M-4,-50 Q8,-30 8,10 L0,15 L-4,15 Z" fill="#faf6f0"/>
      <path d="M0,15 L0,45" stroke="#faf6f0" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Star of Quality -->
  <polygon points="256,76 264,96 286,96 268,108 274,128 256,116 238,128 244,108 226,96 248,96" fill="url(#goldGrad)"/>

  <!-- Banner text 'LA FIERTÉ' -->
  <g transform="translate(256, 420)">
    <rect x="-135" y="-22" width="270" height="44" rx="22" fill="#faf6f0" filter="url(#shadow)"/>
    <text x="0" y="8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="900" fill="#7c2d12" text-anchor="middle" letter-spacing="3">LA FIERTÉ</text>
  </g>
</svg>
